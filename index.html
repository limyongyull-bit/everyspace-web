<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>EVERY SPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/Inter-500.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/Inter-700.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(assets/fonts/BarlowCondensed-700.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Space Mono"; font-weight: 700; src: url(assets/fonts/SpaceMono-700.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Rubik"; font-weight: 800; src: url(assets/fonts/Rubik-800.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Archivo Black"; font-weight: 400; src: url(assets/fonts/ArchivoBlack.ttf) format("truetype"); font-display: swap; }
  :root {
    --bg: #efe9da;
    --ink: #2a2620;
    --muted: #7a7264;
    --teal: #169e94;
    --red: #d63a3a;
    --line: rgba(42, 38, 32, 0.14);
    --osd: "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--ink);
    font-family: "Inter", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #touch { position: fixed; inset: 0; touch-action: none; }

  /* camcorder OSD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; color: #f4f4f4;
    font-family: var(--osd); font-size: clamp(18px, 3.2vmin, 28px); line-height: 1.05; letter-spacing: .04em;
    text-shadow: 2px 2px 0 rgba(0,0,0,.55), 0 0 6px rgba(255,255,255,.25); }
  #hud.on { display: block; }
  .osd { position: absolute; }
  .osd .k { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: .72em; font-weight: 700; letter-spacing: 0; }
  #osdTL { top: calc(16px + env(safe-area-inset-top)); left: calc(22px + env(safe-area-inset-left)); }
  #osdTR { top: calc(16px + env(safe-area-inset-top)); right: calc(22px + env(safe-area-inset-right)); text-align: right; }
  #osdBR { bottom: calc(16px + env(safe-area-inset-bottom)); right: calc(22px + env(safe-area-inset-right)); text-align: right; }
  #osdBC { bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); text-align: center; }
  #play::after { content: " ▶"; }
  body:not(.cam-vhs) #play, body:not(.cam-vhs) #osdBR { display: none; }
  body:not(.cam-vhs) #hud { font-family: "Barlow Condensed", system-ui, sans-serif;
    font-size: clamp(15px, 2.6vmin, 20px); font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  body:not(.cam-vhs) #osdTR { font-family: "Space Mono", ui-monospace, monospace; font-size: .85em; letter-spacing: 0; }
  body:not(.cam-vhs) .osd .k { font-size: 1em; }
  body:not(.cam-vhs) #toast .t { font-size: 1.5em; }
  body:not(.cam-vhs) #toast .b { font-size: .85em; }
  #sprintTag { opacity: 0; } #sprintTag.on { opacity: 1; color: #ff5a4a; }
  #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 0 2px #000; }
  #toast {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%); text-align: center;
    width: min(90vw, 620px); opacity: 0; transition: opacity .35s;
  }
  #toast.on { opacity: 1; }
  #toast .t { font-size: 1.25em; }
  #toast .b { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: .62em; font-weight: 700; margin-top: 4px; letter-spacing: 0; }
  #toast.warn .t { color: #ff5a4a; }

  /* touch controls */
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); pointer-events: none; display: none; }
  #joy .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%;
    background: rgba(255,255,255,.35); }
  #jumpBtn { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(86px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14);
    font: inherit; font-size: 14px; font-weight: 800; color: #fff; touch-action: none; display: none; text-shadow: 0 1px 2px #000; }
  body.touch.playing #jumpBtn { display: block; }
  #useBtn { position: fixed; right: calc(108px + env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(120,255,170,.55); background: rgba(80,255,150,.16);
    font: inherit; font-size: 11px; font-weight: 800; color: #dfffe9; touch-action: none; display: none; text-shadow: 0 1px 2px #000; }
  body.touch.playing.has-item #useBtn { display: block; }
  #osdBL { left: calc(18px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); color: #b8ffd0; }

  /* overlays */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(20,18,15,.45); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); overflow-y: auto; }
  .overlay.on { display: flex; }
  .card { --ink: #f2f0ea; --muted: #a9a395; --line: rgba(255,255,255,.14);
    width: min(560px, 100%); background: rgba(14,13,12,.72); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); margin: auto; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .logo { margin: 4px 0 0; line-height: 0; }
  .logo img { width: 100%; height: auto; display: block; filter: drop-shadow(0 2px 10px rgba(0,0,0,.5)); }
  .sub { color: var(--muted); font: 700 13px/1 "Barlow Condensed", sans-serif; letter-spacing: .5em; margin: 12px 0 14px; }
  p { margin: 8px 0; line-height: 1.55; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 140px; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--ink); }
  input[type=text]::placeholder { color: var(--muted); }
  button.main { font: 700 19px/1 "Barlow Condensed", sans-serif; letter-spacing: .12em; padding: 11px 22px; border-radius: 10px; border: 0;
    background: var(--ink); color: #111; cursor: pointer; }
  button.main:disabled { opacity: .45; cursor: default; }
  button.ghost { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; }
  button.ghost.sel { background: var(--ink); color: #111; }
  label.tog { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; margin-right: 12px; cursor: pointer; }
  h3 { margin: 20px 0 8px; font: 700 15px/1 "Barlow Condensed", sans-serif; letter-spacing: .16em; color: var(--muted); }
  .lb { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .lb td.n { font-family: "Space Mono", ui-monospace, monospace; font-size: 13px; }
  .lb td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
  .lb td:first-child { width: 2em; color: var(--muted); }
  .lb td.n { text-align: right; }
  .lb tr.me td { color: var(--teal); font-weight: 800; }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .dex div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .dex b { display: block; font: 700 16px/1.2 "Barlow Condensed", sans-serif; letter-spacing: .06em; color: var(--ink); }
  .dex .live b::after { content: " ●"; color: var(--red); font-size: 10px; vertical-align: middle; }
  .keys { font-size: 12px; color: var(--muted); }
  #deathCause { font: 700 30px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .stats { display: flex; gap: 18px; margin: 10px 0; font-variant-numeric: tabular-nums; }
  .stats div { font-size: 12px; color: var(--muted); }
  .stats b { display: block; font: 700 26px/1.2 "Space Mono", ui-monospace, monospace; color: var(--ink); }
  .lbsrc { font-size: 11px; color: var(--muted); margin-top: 6px; }
  #loadBar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 10px 0 4px; }
  #loadBar i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .2s; }
  #loadTxt { font-size: 12px; color: var(--muted); min-height: 1.4em; margin-bottom: 8px; }
</style>

  <div class="osd" id="osdTR"><div><span id="distTxt">0000</span>M</div><div>ZONE <span id="clearTxt">00</span> <span id="rankTxt">#–</span></div></div>

</div>

    </div>
    <div class="row"><button class="main" id="againBtn">TRY AGAIN</button><button class="ghost" id="menuBtn">Menu</button></div>
    <h3>LEADERBOARD</h3>

      <button class="ghost sel" data-tab="dist">Distance</button>
      <button class="ghost" data-tab="zones">Zones</button>
    </div>
    <table class="lb" id="lbDead"></table>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

/* ============================================================
   CONFIG
   ============================================================ */
const ASSETS = 'assets/';
const CFG = {
  eye: 1.62, radius: 0.32, walk: 4.0, sprint: 6.8, gravity: 22, jumpV: 6.6,
  ceil: 3.2, lookSens: 0.0052, mouseSens: 0.0024,
  fogNear: 6, fogFar: 46, fogColor: 0xe9e3d3,
  fisheye: 0.32, exposure: 1.15, maxRenderH: 540,
};
const DEBUG = new URLSearchParams(location.search).has('debug');

// Creature roster. `live` = implemented. New hazards register in `Hazards`.
const DEX = [
  { id: 'killi', name: 'KILLI', live: true, desc: 'You hear the horn first. Then it comes through the wall.' },
  { id: 'hands', name: 'THE HANDS', live: true, desc: 'It puts the lights out. Stay in the light.' },
  { id: 'matryoshka', name: 'MATRYOSHKA', live: false, desc: 'Rock to break free.' },
  { id: 'extra', name: 'EXTRA', live: false, desc: "Don't stare." },
  { id: 'niki', name: 'NIKI', live: true, desc: "Stay close to her. Don't run unless you can keep running." },
  { id: 'whistle', name: 'WHISTLE', live: false, desc: 'Avoid the beep.' },
];
const CAUSES = { killi: 'Crushed by Killi', hands: 'Taken by The Hands', niki: 'Caught by Mad Niki' };

/* ============================================================
   UTIL
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pad4 = n => String(n).padStart(4, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { } },
};

/* ============================================================
   RENDERER + POST
   HDR scene -> lens (fisheye + motion blur) -> VHS (tone map, chroma bleed, tape feedback) -> screen
   ============================================================ */
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // tone mapping + sRGB encode happen in the VHS pass
renderer.toneMapping = THREE.NoToneMapping;
renderer.setPixelRatio(1);

const scene = new THREE.Scene();
const fogLinear = new THREE.Color(CFG.fogColor);           // ColorManagement converts hex -> linear
scene.background = fogLinear.clone();
scene.fog = new THREE.Fog(fogLinear.clone(), CFG.fogNear, CFG.fogFar);

const camera = new THREE.PerspectiveCamera(74, 1, 0.1, 70);   // near 0.1 m: ~2x depth precision in the distance
camera.rotation.order = 'YXZ';
camera.layers.enable(1);
scene.add(camera);   // held items (the glow stick) hang off the camera

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.03).texture;

// HDR targets where the GPU can render to half-float (almost all WebGL2 devices); 8-bit fallback otherwise
const HDR = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');
const hdrType = HDR ? THREE.HalfFloatType : THREE.UnsignedByteType;
const rtScene = new THREE.WebGLRenderTarget(4, 4, { type: hdrType, depthBuffer: true, samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
const rtLens = new THREE.WebGLRenderTarget(4, 4, { type: hdrType, depthBuffer: false });
// floor reflection pass (see makeReflective)
const rtRefl = new THREE.WebGLRenderTarget(4, 4, { type: hdrType, depthBuffer: true });
const reflCam = new THREE.PerspectiveCamera();
reflCam.rotation.order = 'YXZ';
const REFL = { tRefl: { value: rtRefl.texture }, uReflVP: { value: new THREE.Matrix4() }, uReflPx: { value: new THREE.Vector2(1, 1) }, uReflOn: { value: 1 } };
const BLANK_TEX = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); BLANK_TEX.needsUpdate = true;
const rtTape = [0, 1].map(() => new THREE.WebGLRenderTarget(4, 4, { depthBuffer: false }));
let tapeIdx = 0;

const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;
const lensMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rtScene.texture }, uK: { value: CFG.fisheye }, uAspect: { value: 1 },
    uVel: { value: new THREE.Vector2() }, uZoom: { value: 0 },
  },
  vertexShader: FS_VERT,
  fragmentShader: `
    uniform sampler2D tScene; uniform float uK, uAspect, uZoom; uniform vec2 uVel; varying vec2 vUv;
    vec2 warp(vec2 uv){
      vec2 p = uv * 2. - 1.; p.x *= uAspect;
      float r2 = dot(p, p) / (uAspect * uAspect + 1.);
      p *= (1. + uK * r2) / (1. + uK);
      p.x /= uAspect; return p * .5 + .5;
    }
    void main(){
      vec2 uv = warp(vUv);
      vec3 acc = vec3(0.); float wsum = 0.;
      // camera motion blur: 180-degree shutter along screen-space rotation velocity + forward zoom streaks
      for (int i = 0; i < 12; i++) {
        float t = float(i) / 11. - .5;
        vec2 o = uVel * t + (uv - .5) * uZoom * t;
        float w = 1. - abs(t) * .8;
        acc += texture2D(tScene, uv + o).rgb * w; wsum += w;
      }
      gl_FragColor = vec4(acc / wsum, 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const vhsMat = new THREE.ShaderMaterial({
  uniforms: {
    tLens: { value: rtLens.texture }, tPrev: { value: null }, uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 }, uExposure: { value: CFG.exposure }, uVhs: { value: 1 }, uDark: { value: 0 }, uBlind: { value: 0 },
    uGlitch: { value: 0 }, uISO: { value: 0 },
  },
  vertexShader: FS_VERT,
  fragmentShader: `
    uniform sampler2D tLens, tPrev; uniform vec2 uRes; uniform float uTime, uExposure, uVhs, uDark, uBlind, uGlitch, uISO;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float vnoise(float x){ float i = floor(x), f = fract(x); return mix(hash(vec2(i, 0.)), hash(vec2(i + 1., 0.)), f * f * (3. - 2. * f)); }
    vec3 aces(vec3 x){ return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }
    vec3 toYIQ(vec3 c){ return mat3(.299, .596, .211, .587, -.274, -.523, .114, -.322, .312) * c; }
    vec3 fromYIQ(vec3 c){ return mat3(1., 1., 1., .956, -.272, -1.106, .621, -.647, 1.703) * c; }
    vec3 grade(vec3 hdr){ return pow(aces(hdr * uExposure), vec3(1. / 2.2)); }
    vec3 phone(vec2 uv){
      // modern phone camera: lateral CA at the edges, local-contrast sharpening, highlight haze, fine sensor noise
      vec2 c = uv - .5; vec2 ca = c * dot(c, c) * .005;
      vec3 hdr = vec3(texture2D(tLens, uv + ca).r, texture2D(tLens, uv).g, texture2D(tLens, uv - ca).b);
      vec2 px = 1. / uRes;
      vec3 bl = (texture2D(tLens, uv + vec2(px.x, 0.)).rgb + texture2D(tLens, uv - vec2(px.x, 0.)).rgb
               + texture2D(tLens, uv + vec2(0., px.y)).rgb + texture2D(tLens, uv - vec2(0., px.y)).rgb) * .25;
      hdr = max(hdr + (hdr - bl) * .35 * (1. - uISO * .75), 0.);   // phones smear detail when denoising at high ISO
      vec3 haze = vec3(0.);
      for (int i = 0; i < 8; i++) {
        float a = float(i) * .7854;
        haze += max(texture2D(tLens, uv + vec2(cos(a), sin(a)) * vec2(.03, .05)).rgb * uExposure - .9, 0.);
      }
      hdr += haze * .01;
      vec3 col = pow(aces(hdr * uExposure), vec3(1. / 2.2));
      col = mix(col, col * col * (3. - 2. * col), .22);                  // photo S-curve: deeper shadows, denser mids
      float awb = sin(uTime * 0.13) * 0.5 + sin(uTime * 0.071 + 1.7) * 0.5;
      col *= vec3(1. + awb * .012, 1., 1. - awb * .018);                   // auto white balance hunting slightly
            float n = hash(uv * uRes + fract(uTime) * 91.) - .5;
      vec3 cn = vec3(hash(uv * uRes * 1.3 + uTime), hash(uv * uRes * 0.7 - uTime), hash(uv * uRes + 17.)) - .5;
      col += n * (.016 + uISO * .07) + cn * uISO * .04;          // luma + chroma sensor noise
      col = mix(col, col * vec3(1.0, 1.03, .94), uISO);              // low-light green/warm cast
      return col;
    }
    void main(){

  scene.fog.color.lerp(game.fogTarget, Math.min(1, dt * 1.5));
  scene.background.copy(scene.fog.color);
  game.expNow += ((game.expTarget || 1) - game.expNow) * Math.min(1, dt * 1.2);
  u.uExposure.value = CFG.exposure * game.expNow * (1 + game.iso * 0.8) * (1 + Math.sin(now * 0.031) * 0.006 + (Math.random() < 0.004 ? -0.05 : 0));

  for (const m of PANOS) if (m.parent?.parent) m.position.set(camera.position.x, 1.6, camera.position.z); else PANOS.delete(m);
  if (OPT.refl) {
    reflCam.fov = camera.fov; reflCam.aspect = camera.aspect; reflCam.near = camera.near; reflCam.far = camera.far;
    reflCam.updateProjectionMatrix();
    reflCam.position.set(camera.position.x, -camera.position.y, camera.position.z);
    reflCam.rotation.set(-camera.rotation.x, camera.rotation.y, -camera.rotation.z);
    reflCam.updateMatrixWorld();
    REFL.uReflVP.value.multiplyMatrices(reflCam.projectionMatrix, reflCam.matrixWorldInverse);
    // walls and ceilings share the reflective shader: while drawing the reflection they must not read it
    REFL.tRefl.value = BLANK_TEX;
    renderer.setRenderTarget(rtRefl);
    renderer.render(scene, reflCam);
    REFL.tRefl.value = rtRefl.texture;
  }
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  fsPass(lensMat, rtLens);
  const cur = rtTape[tapeIdx];
  u.tPrev.value = rtTape[1 - tapeIdx].texture;
  fsPass(vhsMat, cur);
  copyMat.uniforms.tSrc.value = cur.texture;
  fsPass(copyMat, null);
  tapeIdx = 1 - tapeIdx;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
LB.init();

loadAssets((f, label) => {
  $('loadBar').firstElementChild.style.width = Math.round(f * 100) + '%';
  $('loadTxt').textContent = `Loading… ${label}`;
}).then(() => {
  ready = true;
  game.reset();
  streamRest();
  $('loadTxt').textContent = ASSET.meta.quick ? 'Ready (preview assets)' : 'Ready';
  $('startBtn').disabled = false;
}).catch(err => {
  console.error(err);
  $('loadTxt').innerHTML = location.protocol === 'file:'
    ? 'Open this through a web server (e.g. <code>npx http-server</code> or GitHub Pages) — browsers block file:// assets.'
    : 'Failed to load assets: ' + escapeHTML(err.message || String(err));
});
if (DEBUG) window.__ieori = { game, zones: () => zones, start, input, ASSET, OPT, CFG, vhsMat, lensMat, Killi, THREE, renderer, rtRefl, REFL, scene, NIKI, GLOW, DARK, HandsMound, killiLanes, spawnKilli, SFX };
</script>
